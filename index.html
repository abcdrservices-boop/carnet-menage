<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet ménage">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Carnet de visite ménage</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: tablet-first; visits rail on the left, editor with tabs, sticky time/price bar at the bottom */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#1c2a3a; --muted:#5d6b7a; --line:#d9e0e7;
  --accent:#1f5f8b; --accent-soft:#e3eef6; --gold:#c98a12; --gold-soft:#fbf0d9;
  --ok:#2f7d4f; --warn:#b5541b;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111820; --surface:#18222d; --ink:#e6edf3; --muted:#9aa9b8; --line:#2a3846;
  --accent:#6fb2e0; --accent-soft:#1d3346; --gold:#e8b04a; --gold-soft:#3a2f17;
  --ok:#6cc792; --warn:#f08d55; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111820; --surface:#18222d; --ink:#e6edf3; --muted:#9aa9b8; --line:#2a3846;
  --accent:#6fb2e0; --accent-soft:#1d3346; --gold:#e8b04a; --gold-soft:#3a2f17;
  --ok:#6cc792; --warn:#f08d55; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font:700 1.6rem/1.1 var(--display);margin:0;text-wrap:balance}
h2{font:700 1.2rem/1.2 var(--display);margin:0}
h3{font:500 1rem/1.2 var(--display);margin:0}
.sub{color:var(--muted);font-size:.9rem}
.layout{display:grid;grid-template-columns:260px 1fr;gap:20px}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.rail{display:flex;flex-direction:column;gap:8px;min-width:0}
.visit{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;color:inherit;font:inherit;cursor:pointer}
.visit.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.visit b{display:block}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-weight:700}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;padding:12px 16px;min-height:48px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:700}
input[type=text],input[type=tel],input[type=email],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
textarea{min-height:64px;resize:vertical}
.level{font:700 .78rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.room.off{opacity:.55}
.room-h{display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap}
.room-h h3{flex:1;min-width:140px}
.room-h input.rn{font:500 1rem var(--display);border:0;background:transparent;padding:4px;min-height:36px;color:var(--ink);width:100%}
.mins{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.prio{min-width:44px;min-height:44px;border-radius:99px;border:1px dashed var(--line);background:none;cursor:pointer;font-weight:700;color:var(--muted)}
.prio.set{border:0;background:var(--gold);color:var(--surface)}
.vit{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vit button{border:0;background:none;padding:6px 10px;min-height:40px;cursor:pointer;font-size:.85rem}
.vit button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tasks{border-top:1px solid var(--line);padding:4px 12px 10px}
.task{display:grid;grid-template-columns:32px 1fr auto auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
.task select{min-height:38px;padding:4px 6px;font-size:.85rem;width:auto}
.task .mins{min-width:52px;text-align:right}
@media (max-width:520px){.task{grid-template-columns:32px 1fr auto}.task select{grid-column:2/4;justify-self:start}}
.addline{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.addline input{flex:1;min-width:160px}
.addline input.n{flex:0 0 80px;min-width:0}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer}
.toggle input{width:24px;height:24px;accent-color:var(--accent)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:1.1rem}
.step span{min-width:24px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
table.r{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.r td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.r td.n{text-align:right;white-space:nowrap}
table.r tr.tot td{font-weight:700;border-bottom:0}
.priolist{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.bar-in{max-width:1180px;margin:0 auto;display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.bar .k{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75;display:block}
.bar .v{font:700 1.25rem var(--display)}
.bar .alert{color:var(--gold)}
.note{font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photos{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden}
.pbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.thumb{background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:var(--line)}
.thumb input{border:0;border-top:1px solid var(--line);border-radius:0;min-height:40px;font-size:.85rem;padding:6px 8px}
.thumb .del{border:0;border-top:1px solid var(--line);background:none;color:var(--warn);min-height:40px;cursor:pointer;font-size:.85rem}
.busy{font-size:.85rem;color:var(--accent)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:6px}
.sheet h2{margin-top:8px}
.sheet .sroom{break-inside:avoid;border-top:1px solid var(--line);padding:10px 0}
.sheet ul{margin:6px 0;padding-left:1.3em}
.sheet .sph{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.sheet figure{margin:0;break-inside:avoid}
.sheet figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.sheet figcaption{font-size:.8rem;color:var(--muted)}
.sheet dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:6px 0}
.sheet dt{color:var(--muted);font-weight:700;font-size:.85rem}.sheet dd{margin:0}
@media print{
  body{background:#fff;color:#000}
  .wrap{padding:0;max-width:none}
  header.top,.rail,.tabs,.bar,.noprint{display:none!important}
  .layout{display:block}
  .card{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Carnet de visite ménage</h1>
      <div class="sub">Feuille de route et estimation du devis, pièce par pièce</div>
    </div>
    <button class="btn primary" id="newVisit">Nouvelle visite</button>
  </header>
  <div class="layout">
    <aside class="rail" id="rail"></aside>
    <main id="main"></main>
  </div>
</div>
<div class="bar"><div class="bar-in" id="bar"></div></div>

<script>
const TARIF = { heure: 34.54, gestion: 12.5, km: 4.5 };
const FREQS = { hebdo: { label: "Chaque semaine", passages: 4 }, bimensuel: { label: "Une semaine sur deux", passages: 2 }, mensuel: { label: "Une fois par mois", passages: 1 } };
const MODES = { chaque: "Chaque passage", mensuel: "Une fois par mois", demande: "Sur demande" };
const REPASSAGE = [["Chemise, chemisier", 6], ["Robe", 7], ["Pantalon", 5], ["T-shirt, polo", 3], ["Drap, housse de couette", 8], ["Taie, serviette, torchon", 2], ["Linge plié sans repassage", 1]];

// Maison type: [niveau, pièce, présente par défaut, [[tâche, minutes, cochée]]]
const MODELE = [
  ["Rez-de-chaussée", "Entrée", true, [["Dépoussiérer meubles et rangements", 3, 1], ["Miroir", 2, 1], ["Sols", 5, 1]]],
  ["Rez-de-chaussée", "Cuisine", true, [["Plan de travail : débarrasser, nettoyer, désinfecter", 10, 1], ["Évier et robinetterie", 5, 1], ["Plaque de cuisson", 5, 1], ["Micro-ondes : façade et intérieur", 5, 1], ["Façades des meubles et de l'électroménager", 10, 1], ["Vider ou remplir le lave-vaisselle", 5, 0], ["Sortir les poubelles", 3, 0], ["Intérieur du réfrigérateur", 15, 0, "mensuel"], ["Intérieur du four", 15, 0, "mensuel"], ["Sols", 10, 1]]],
  ["Rez-de-chaussée", "Salon-séjour", true, [["Dépoussiérer meubles, étagères, déco", 10, 1], ["Télévision et électronique", 3, 1], ["Canapé : plaids, coussins, dépoussiérer", 5, 1], ["Table et chaises", 5, 1], ["Rangement léger", 5, 0], ["Derrière et sous les meubles", 15, 0, "mensuel"], ["Sols", 15, 1]]],
  ["Rez-de-chaussée", "WC", true, [["Cuvette, abattant, extérieur", 5, 1], ["Lave-mains", 3, 1], ["Sol", 3, 1]]],
  ["Rez-de-chaussée", "Buanderie", false, [["Lancer ou étendre une machine", 5, 1], ["Sol", 5, 1]]],
  ["Étage", "Salle de bain parentale", true, [["Douche ou baignoire : parois, robinetterie, bac", 10, 1], ["Vasque, robinetterie, plan, façades", 5, 1], ["Miroir", 3, 1], ["Porte-serviette, changer les serviettes", 2, 1], ["Sol", 5, 1]]],
  ["Étage", "Salle de bain 2", true, [["Baignoire ou douche", 10, 1], ["Vasque, robinetterie, plan, façades", 5, 1], ["Miroir", 3, 1], ["Sol", 5, 1]]],
  ["Étage", "WC étage", true, [["Cuvette, lave-mains, sol", 10, 1]]],
  ["Étage", "Chambre parentale", true, [["Dépoussiérer meubles, TV", 8, 1], ["Miroirs", 3, 1], ["Faire le lit", 5, 0, "demande"], ["Changer les draps", 10, 0, "demande"], ["Sols", 8, 1]]],
  ["Étage", "Chambre enfant", true, [["Dépoussiérer, déplacer fauteuils et coffre", 8, 1], ["Sols", 8, 1]]],
  ["Étage", "Salle de jeu", true, [["Sols", 5, 1]]],
  ["Étage", "Dressing", true, [["Dépoussiérer", 3, 1], ["Sol", 3, 1]]],
  ["Étage", "Bureau", false, [["Dépoussiérer, sols", 10, 1]]],
  ["Étage", "Chambre d'amis", false, [["Dépoussiérer, sols", 10, 1]]],
  ["Circulations", "Escaliers", true, [["Sols, du haut vers le bas", 10, 1], ["Rampe et main courante", 3, 1]]],
  ["Circulations", "Couloirs et paliers", true, [["Sols", 8, 1], ["Plinthes, portes et interrupteurs", 15, 0, "mensuel"], ["Luminaires et toiles d'araignée", 10, 0, "mensuel"]]],
  ["Circulations", "Arrivée et départ", true, [["Alarme, sortir et ranger le matériel", 10, 1]]]
];
const NIVEAUX = ["Sous-sol", "Rez-de-chaussée", "Demi-palier", "Étage", "Circulations", "Extérieur"];

const uid = () => Math.random().toString(36).slice(2, 9);
function nouvelleVisite() {
  return {
    id: uid(), exemple: false, date: new Date().toISOString().slice(0, 10),
    client: { nom: "", adresse: "", tel: "", email: "", jour: "", configuration: "", acces: "", securite: "", animaux: "", produits: "", materiel: "", poubelles: "", linge: "", precautions: "", foyer: "" },
    freq: "bimensuel", duree: null,
    pieces: MODELE.map(([niveau, nom, present, taches]) => ({
      id: uid(), niveau, nom, present, prio: 0, vitres: "", note: "",
      taches: taches.map(([t, min, on, mode]) => ({ id: uid(), t, min, on: !!on || mode === "mensuel" ? !!on : !!on, mode: mode || "chaque" }))
    })),
    repassage: { on: false, qte: REPASSAGE.map(() => 0) }
  };
}
function exempleSadin() {
  const v = nouvelleVisite();
  v.exemple = true;
  Object.assign(v.client, { nom: "Mme Justine Sadin (exemple)", adresse: "4 rue Raoul Dautry, 54800 Conflans-en-Jarnisy", jour: "Mercredi matin", configuration: "Sous-sol, rez-de-chaussée, demi-palier, étage", securite: "Alarme et vidéosurveillance : procédure à confirmer avec la cliente", produits: "Buanderie au sous-sol", materiel: "Buanderie au sous-sol", linge: "Lave-linge et sèche-linge à la buanderie", precautions: "Canapé : dépoussiérer, ne pas aspirer", foyer: "Le fils de la cliente utilise la salle de bain 2" });
  const p = n => v.pieces.find(x => x.nom === n);
  p("Entrée").present = false; p("WC étage").present = false;
  p("Bureau").note = "Sur demande uniquement"; p("Chambre d'amis").note = "Sur demande uniquement";
  ["Salle de bain 2", "Chambre enfant", "Salle de jeu", "Dressing"].forEach(n => p(n).niveau = "Demi-palier");
  p("Chambre enfant").nom = "Chambre d'Eliott";
  p("Cuisine").prio = 1; p("Salle de bain parentale").prio = 2; p("WC").prio = 3; p("Salle de bain 2").prio = 4;
  p("Salle de bain 2").note = "Baignoire en priorité. Douche non fonctionnelle : à confirmer.";
  p("Cuisine").vitres = "A"; p("Salon-séjour").vitres = "A";
  ["Chambre parentale", "Chambre d'Eliott", "Dressing"].forEach(n => p(n).vitres = "B");
  p("Salon-séjour").taches.find(t => t.t.startsWith("Derrière")).on = true;
  p("Salon-séjour").taches.find(t => t.t.startsWith("Derrière")).t = "Jeux derrière le canapé : nettoyer derrière, vitres";
  v.duree = 4;
  return v;
}

const KEY = "carnet-visites-v1";
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
if (!state || !state.visites || !state.visites.length) { const ex = exempleSadin(); state = { visites: [ex], courante: ex.id, onglet: "client" }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const cur = () => state.visites.find(v => v.id === state.courante) || state.visites[0];

function calcul(v) {
  const pieces = v.pieces.filter(p => p.present);
  const passages = FREQS[v.freq].passages;
  let base = 0, mensuel = 0;
  pieces.forEach(p => p.taches.forEach(t => { if (!t.on) return; if (t.mode === "chaque") base += +t.min || 0; else if (t.mode === "mensuel") mensuel += +t.min || 0; }));
  const vA = pieces.filter(p => p.vitres === "A").length * 10, vB = pieces.filter(p => p.vitres === "B").length * 10;
  const vitres = v.freq === "mensuel" ? vA + vB : Math.max(vA, vB);
  const mensuelParPassage = Math.round(mensuel / passages);
  const rep = v.repassage.on ? v.repassage.qte.reduce((s, q, i) => s + q * REPASSAGE[i][1], 0) : 0;
  const total = base + vitres + mensuelParPassage + rep;
  const propose = Math.max(1, Math.ceil(total / 30) / 2);
  const duree = v.duree || propose;
  const heures = duree * passages;
  const ttc = heures * TARIF.heure + TARIF.gestion + passages * TARIF.km;
  return { base, vitres, vA, vB, mensuel, mensuelParPassage, rep, total, propose, duree, passages, heures, ttc, apres: ttc / 2 };
}
const hm = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? `${h} h${r ? " " + String(r).padStart(2, "0") : ""}` : `${r} min`; };
const eur = n => n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dureeTxt = d => { const h = Math.floor(d), m = Math.round((d - h) * 60); return `${h} h${m ? " " + m : ""}`; };

function renderRail() {
  document.getElementById("rail").innerHTML = state.visites.map(v => `
    <button class="visit ${v.id === state.courante ? "on" : ""}" data-visit="${v.id}">
      <b>${esc(v.client.nom || "Client sans nom")}</b>
      <span class="sub">${new Date(v.date).toLocaleDateString("fr-FR")} · ${FREQS[v.freq].label.toLowerCase()}</span>
      ${v.exemple ? ' <span class="tag">Exemple</span>' : ""}
    </button>`).join("");
}

const CHAMPS = [["nom", "Client"], ["adresse", "Adresse d'intervention"], ["tel", "Téléphone", "tel"], ["email", "E-mail", "email"], ["jour", "Jour et créneau"], ["configuration", "Configuration de la maison"], ["acces", "Accès et clés"], ["securite", "Alarme, vidéosurveillance"], ["animaux", "Animaux"], ["produits", "Rangement des produits"], ["materiel", "Rangement aspirateur et serpillère"], ["poubelles", "Poubelles et tri"], ["linge", "Linge (machines, séchage)"], ["precautions", "Interdits et précautions"], ["foyer", "Personnes du foyer"]];

function renderClient(v) {
  return `<div class="panel">
    <div class="grid2">
      <label class="f">Date de la visite<input type="text" id="f-date" data-field="date" value="${esc(v.date)}"></label>
      <label class="f">Fréquence souhaitée<select id="f-freq" data-field="freq">${Object.entries(FREQS).map(([k, f]) => `<option value="${k}" ${v.freq === k ? "selected" : ""}>${f.label}</option>`).join("")}</select></label>
      ${CHAMPS.map(([k, l, type]) => `<label class="f">${l}<input type="${type || "text"}" id="c-${k}" data-client="${k}" value="${esc(v.client[k])}"></label>`).join("")}
    </div>
    <div class="card"><h3>Photos générales</h3>
      <p class="note">Rangement des produits et du matériel, compteur, alarme, accès… Chaque photo peut recevoir une légende.</p>
      ${renderPhotos("general")}</div>
    <div class="row"><button class="btn danger" data-action="supprimer">Supprimer cette visite</button></div>
  </div>`;
}

function renderPieces(v) {
  const niveaux = NIVEAUX.filter(n => v.pieces.some(p => p.niveau === n));
  return `<div class="panel">
    <p class="note">Décochez les pièces absentes, ajustez les tâches, touchez le rond pour donner une priorité (1 à 5) et choisissez le passage des vitres.</p>
    ${niveaux.map(n => `<div class="level">${n}</div>${v.pieces.filter(p => p.niveau === n).map(p => renderPiece(p)).join("")}`).join("")}
    <div class="card"><h3>Ajouter une pièce</h3>
      <div class="addline"><input type="text" id="np-nom" placeholder="Nom de la pièce (véranda, garage…)">
      <select id="np-niv">${NIVEAUX.map(n => `<option>${n}</option>`).join("")}</select>
      <button class="btn" data-action="ajout-piece">Ajouter</button></div></div>
  </div>`;
}
function renderPiece(p) {
  const min = p.taches.filter(t => t.on && t.mode === "chaque").reduce((s, t) => s + (+t.min || 0), 0);
  return `<section class="room ${p.present ? "" : "off"}">
    <div class="room-h">
      <label class="toggle" title="Pièce présente"><input type="checkbox" data-piece="${p.id}" data-k="present" ${p.present ? "checked" : ""}></label>
      <h3><input class="rn" id="rn-${p.id}" data-piece="${p.id}" data-k="nom" value="${esc(p.nom)}" aria-label="Nom de la pièce"></h3>
      <span class="mins">${hm(min)}</span>
      <div class="vit" role="group" aria-label="Vitres">${["", "A", "B"].map(x => `<button class="${p.vitres === x ? "on" : ""}" data-vitres="${x}" data-piece="${p.id}">${x ? "Vitres " + x : "Sans vitres"}</button>`).join("")}</div>
      <button class="prio ${p.prio ? "set" : ""}" data-prio="${p.id}" aria-label="Priorité">${p.prio || "–"}</button>
    </div>
    ${p.present ? `<div class="tasks">
      ${p.taches.map(t => `<div class="task">
        <input type="checkbox" aria-label="${esc(t.t)}" data-tache="${t.id}" data-piece="${p.id}" data-k="on" ${t.on ? "checked" : ""}>
        <span>${esc(t.t)}</span>
        <select aria-label="Fréquence" data-tache="${t.id}" data-piece="${p.id}" data-k="mode">${Object.entries(MODES).map(([k, l]) => `<option value="${k}" ${t.mode === k ? "selected" : ""}>${l}</option>`).join("")}</select>
        <span class="mins">${t.min} min</span>
      </div>`).join("")}
      <div class="addline"><input type="text" id="nt-${p.id}" placeholder="Autre tâche"><input type="text" inputmode="numeric" class="n" id="ntm-${p.id}" placeholder="min"><button class="btn" data-action="ajout-tache" data-piece="${p.id}">Ajouter</button></div>
      <div class="addline"><input type="text" id="note-${p.id}" data-piece="${p.id}" data-k="note" placeholder="Consigne pour cette pièce" value="${esc(p.note)}"></div>
      ${renderPhotos(p.id)}
    </div>` : ""}
  </section>`;
}

function renderOptions(v) {
  const r = v.repassage, c = calcul(v);
  return `<div class="panel">
    <div class="card panel">
      <label class="toggle"><input type="checkbox" id="rep-on" data-action="rep-on" ${r.on ? "checked" : ""}><h2>Option repassage</h2></label>
      <p class="note">Indiquez le panier habituel par passage. Repère : environ 15 articles variés par heure.</p>
      ${r.on ? `<div class="items">${REPASSAGE.map(([l, m], i) => `<div class="item"><span>${l}<br><span class="note">${m} min</span></span>
        <div class="step"><button data-rep="${i}" data-d="-1" aria-label="Moins">−</button><span>${r.qte[i]}</span><button data-rep="${i}" data-d="1" aria-label="Plus">+</button></div></div>`).join("")}</div>
        <p><b>Repassage par passage : ${hm(c.rep)}</b></p>` : ""}
    </div>
  </div>`;
}

function renderRecap(v) {
  const c = calcul(v);
  const prios = v.pieces.filter(p => p.present && p.prio).sort((a, b) => a.prio - b.prio);
  const diff = c.total - c.duree * 60;
  return `<div class="panel">
    <div class="card"><h2>Temps d'un passage</h2>
      <table class="r">
        <tr><td>Tâches à chaque passage</td><td class="n">${hm(c.base)}</td></tr>
        <tr><td>Vitres (passage A ${hm(c.vA)}, passage B ${hm(c.vB)})</td><td class="n">${hm(c.vitres)}</td></tr>
        <tr><td>Tâches mensuelles (${hm(c.mensuel)} réparties sur ${c.passages} passage${c.passages > 1 ? "s" : ""})</td><td class="n">${hm(c.mensuelParPassage)}</td></tr>
        <tr><td>Repassage</td><td class="n">${hm(c.rep)}</td></tr>
        <tr class="tot"><td>Total estimé</td><td class="n">${hm(c.total)}</td></tr>
      </table>
      <p>Durée proposée : <b>${dureeTxt(c.propose)}</b> par passage.</p>
      <label class="f">Durée retenue avec le client
        <select id="f-duree" data-field="duree"><option value="">Durée proposée (${dureeTxt(c.propose)})</option>${[1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 5.5, 6].map(d => `<option value="${d}" ${v.duree === d ? "selected" : ""}>${dureeTxt(d)}</option>`).join("")}</select></label>
      ${diff > 0 ? `<p class="note" style="color:var(--warn)">Il manque ${hm(diff)} pour tout faire en ${dureeTxt(c.duree)} : les tâches hors priorités seront faites selon le temps disponible.</p>` : ""}
    </div>
    <div class="card"><h2>Estimation du devis mensuel</h2>
      <table class="r">
        <tr><td>Entretien : ${dureeTxt(c.duree)} × ${c.passages} passage${c.passages > 1 ? "s" : ""} = ${c.heures} h × ${eur(TARIF.heure)}</td><td class="n">${eur(c.heures * TARIF.heure)}</td></tr>
        <tr><td>Frais de gestion</td><td class="n">${eur(TARIF.gestion)}</td></tr>
        <tr><td>Forfait kilomètre (${c.passages} × ${eur(TARIF.km)})</td><td class="n">${eur(c.passages * TARIF.km)}</td></tr>
        <tr class="tot"><td>Total TTC par mois</td><td class="n">${eur(c.ttc)}</td></tr>
        <tr><td>Après crédit d'impôt de 50 %</td><td class="n">${eur(c.apres)}</td></tr>
      </table>
    </div>
    <div class="card"><h2>Priorités du client</h2>
      ${prios.length ? `<ol class="priolist">${prios.map(p => `<li>${esc(p.nom)}${p.note ? ` <span class="note">(${esc(p.note)})</span>` : ""}</li>`).join("")}<li>Le reste de la maison selon le temps disponible</li></ol>` : `<p class="note">Aucune priorité. Touchez le rond à côté d'une pièce, dans l'onglet Pièces.</p>`}
    </div>
  </div>`;
}

const ONGLETS = [["client", "Client"], ["pieces", "Pièces et tâches"], ["options", "Repassage"], ["recap", "Récapitulatif"], ["feuille", "Feuille de route"]];
function render() {
  const v = cur(); state.courante = v.id;
  renderRail();
  const views = { client: renderClient, pieces: renderPieces, options: renderOptions, recap: renderRecap, feuille: renderFeuille };
  document.getElementById("main").innerHTML = `
    <nav class="tabs">${ONGLETS.map(([k, l]) => `<button class="tab ${state.onglet === k ? "on" : ""}" data-tab="${k}">${l}</button>`).join("")}</nav>
    ${views[state.onglet](v)}`;
  renderBar(v);
}
function renderBar(v) {
  const c = calcul(v), over = c.total > c.duree * 60;
  document.getElementById("bar").innerHTML = `
    <div><span class="k">Temps estimé</span><span class="v ${over ? "alert" : ""}">${hm(c.total)}</span></div>
    <div><span class="k">Durée par passage</span><span class="v">${dureeTxt(c.duree)}</span></div>
    <div><span class="k">${FREQS[v.freq].label}</span><span class="v">${eur(c.ttc)} / mois</span></div>
    <div><span class="k">Après crédit d'impôt</span><span class="v">${eur(c.apres)}</span></div>`;
}
function update(keepFocus) { save(); if (keepFocus) { renderRail(); renderBar(cur()); } else render(); }

const findP = (v, id) => v.pieces.find(p => p.id === id);
document.addEventListener("click", e => {
  const z = e.target.closest(".zoom"); if (z) { z.remove(); return; }
  const im = e.target.closest("img[data-zoom]"); if (im) { const o = document.createElement("div"); o.className = "zoom"; o.innerHTML = `<img src="${im.src}" alt="">`; document.body.appendChild(o); return; }
  const b = e.target.closest("button, input[type=checkbox]"); if (!b) return;
  const v = cur(), d = b.dataset;
  if (b.id === "newVisit") { const n = nouvelleVisite(); state.visites.unshift(n); state.courante = n.id; state.onglet = "client"; return update(); }
  if (d.delphoto) {
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Confirmer"; return; }
    supprimerPhoto(d.delphoto); return render();
  }
  if (d.action === "imprimer") { window.print(); return; }
  if (d.action === "exporter") { return exporter(v, b); }
  if (d.visit) { state.courante = d.visit; return update(); }
  if (d.tab) { state.onglet = d.tab; return update(); }
  if (d.prio) { const p = findP(v, d.prio); p.prio = (p.prio + 1) % 6; return update(); }
  if ("vitres" in d && d.piece) { findP(v, d.piece).vitres = d.vitres; return update(); }
  if (d.rep) { const q = v.repassage.qte; q[d.rep] = Math.max(0, q[d.rep] + +d.d); return update(); }
  if (d.action === "ajout-piece") { const nom = document.getElementById("np-nom").value.trim(); if (!nom) return; v.pieces.push({ id: uid(), niveau: document.getElementById("np-niv").value, nom, present: true, prio: 0, vitres: "", note: "", taches: [{ id: uid(), t: "Dépoussiérer", min: 5, on: true, mode: "chaque" }, { id: uid(), t: "Sols", min: 8, on: true, mode: "chaque" }] }); return update(); }
  if (d.action === "ajout-tache") { const t = document.getElementById("nt-" + d.piece).value.trim(), m = parseInt(document.getElementById("ntm-" + d.piece).value, 10) || 5; if (!t) return; findP(v, d.piece).taches.push({ id: uid(), t, min: m, on: true, mode: "chaque" }); return update(); }
  if (d.action === "supprimer") {
    if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Toucher encore pour confirmer"; return; }
    photosDe(v.id).forEach(ph => supprimerPhoto(ph.id));
    state.visites = state.visites.filter(x => x.id !== v.id);
    if (!state.visites.length) state.visites.push(nouvelleVisite());
    state.courante = state.visites[0].id; return update();
  }
});
document.addEventListener("change", e => {
  const el = e.target, d = el.dataset, v = cur();
  if (d.photo) { ajouterPhotos(v.id, d.photo, el.files); el.value = ""; return; }
  if (d.action === "rep-on") { v.repassage.on = el.checked; return update(); }
  if (d.tache) { const t = findP(v, d.piece).taches.find(x => x.id === d.tache); t[d.k] = el.type === "checkbox" ? el.checked : el.value; return update(); }
  if (d.piece && d.k === "present") { findP(v, d.piece).present = el.checked; return update(); }
  if (d.field === "freq") { v.freq = el.value; return update(); }
  if (d.field === "duree") { v.duree = el.value ? +el.value : null; return update(); }
});
document.addEventListener("input", e => {
  const el = e.target, d = el.dataset, v = cur();
  if (d.legende) { const ph = PHOTOS.find(x => x.id === d.legende); if (ph) { ph.legende = el.value; majPhoto(ph); } return; }
  if (d.client) { v.client[d.client] = el.value; return update(true); }
  if (d.field === "date") { v.date = el.value; return update(true); }
  if (d.piece && (d.k === "nom" || d.k === "note")) { findP(v, d.piece)[d.k] = el.value; return update(true); }
});

/* ---------- Photos : compressées puis stockées hors ligne dans IndexedDB ---------- */
const PHOTO_MAX = 1600, PHOTO_QUAL = 0.72;
let PHOTOS = []; const URLS = {}; let enCours = 0;
const dbP = new Promise((ok, ko) => {
  try {
    const r = indexedDB.open("carnet-photos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("photos", { keyPath: "id" });
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  } catch (e) { ko(e); }
});
function tx(mode, fn) { return dbP.then(db => new Promise((ok, ko) => { const t = db.transaction("photos", mode); const req = fn(t.objectStore("photos")); t.oncomplete = () => ok(req && req.result); t.onerror = () => ko(t.error); })); }
const photosDe = (visite, piece) => PHOTOS.filter(p => p.visite === visite && (piece === undefined || p.piece === piece));
const urlDe = ph => URLS[ph.id] || (URLS[ph.id] = URL.createObjectURL(ph.blob));
function majPhoto(ph) { tx("readwrite", s => s.put(ph)).catch(() => {}); }
function supprimerPhoto(id) {
  PHOTOS = PHOTOS.filter(p => p.id !== id);
  if (URLS[id]) { URL.revokeObjectURL(URLS[id]); delete URLS[id]; }
  tx("readwrite", s => s.delete(id)).catch(() => {});
}
async function decoder(file) {
  try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) {}
  return await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(file); });
}
async function compresser(file) {
  const img = await decoder(file);
  const w0 = img.width || img.naturalWidth, h0 = img.height || img.naturalHeight;
  const k = Math.min(1, PHOTO_MAX / Math.max(w0, h0));
  const c = document.createElement("canvas"); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  if (img.close) img.close();
  return await new Promise(ok => c.toBlob(ok, "image/jpeg", PHOTO_QUAL));
}
async function ajouterPhotos(visite, piece, files) {
  const liste = [...(files || [])]; if (!liste.length) return;
  enCours += liste.length; render();
  for (const f of liste) {
    try {
      const blob = await compresser(f);
      const ph = { id: uid(), visite, piece, blob, legende: "", date: Date.now() };
      PHOTOS.push(ph); await tx("readwrite", s => s.put(ph));
    } catch (e) { alert("Cette photo n'a pas pu être enregistrée."); }
    enCours--;
  }
  render();
}
function renderPhotos(piece) {
  const v = cur(), list = photosDe(v.id, piece);
  return `<div class="photos">
    <div class="pbtns">
      <label class="btn pbtn">📷 Prendre une photo<input type="file" accept="image/*" capture="environment" data-photo="${piece}"></label>
      <label class="btn pbtn ghost">🖼️ Depuis la galerie<input type="file" accept="image/*" multiple data-photo="${piece}"></label>
      ${enCours ? `<span class="busy">Enregistrement en cours…</span>` : ""}
    </div>
    ${list.length ? `<div class="thumbs">${list.map(ph => `<div class="thumb">
      <img src="${urlDe(ph)}" alt="${esc(ph.legende || "Photo")}" data-zoom="1">
      <input type="text" placeholder="Légende" data-legende="${ph.id}" value="${esc(ph.legende)}">
      <button class="del" data-delphoto="${ph.id}">Supprimer</button></div>`).join("")}</div>` : ""}
  </div>`;
}
dbP.then(() => tx("readonly", s => s.getAll())).then(all => { PHOTOS = (all || []).sort((a, b) => a.date - b.date); render(); }).catch(() => {});
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ---------- Feuille de route imprimable, avec les photos ---------- */
function feuilleHTML(v, src) {
  const c = calcul(v), cl = v.client;
  const prios = v.pieces.filter(p => p.present && p.prio).sort((a, b) => a.prio - b.prio);
  const fig = list => list.length ? `<div class="sph">${list.map(ph => `<figure><img src="${src(ph)}" alt=""><figcaption>${esc(ph.legende)}</figcaption></figure>`).join("")}</div>` : "";
  const infos = CHAMPS.filter(([k]) => k !== "nom" && cl[k]).map(([k, l]) => `<dt>${l}</dt><dd>${esc(cl[k])}</dd>`).join("");
  const niveaux = NIVEAUX.filter(n => v.pieces.some(p => p.present && p.niveau === n));
  return `<div class="sheet">
    <h1>Feuille de route : ${esc(cl.nom || "client")}</h1>
    <p class="sub">Visite du ${new Date(v.date).toLocaleDateString("fr-FR")} · ${FREQS[v.freq].label.toLowerCase()} · ${dureeTxt(c.duree)} par passage · ${eur(c.ttc)} TTC par mois</p>
    ${infos ? `<dl>${infos}</dl>` : ""}
    ${fig(photosDe(v.id, "general"))}
    ${prios.length ? `<h2>Priorités</h2><ol class="priolist">${prios.map(p => `<li>${esc(p.nom)}</li>`).join("")}<li>Le reste de la maison selon le temps disponible</li></ol>` : ""}
    <h2>Pièces et tâches</h2>
    ${niveaux.map(n => `<div class="level">${n}</div>${v.pieces.filter(p => p.present && p.niveau === n).map(p => {
      const t = p.taches.filter(x => x.on);
      return `<div class="sroom"><h3>${esc(p.nom)}${p.prio ? ` · priorité ${p.prio}` : ""}${p.vitres ? ` · vitres ${p.vitres}` : ""}</h3>
        ${t.length ? `<ul>${t.map(x => `<li>${esc(x.t)}${x.mode !== "chaque" ? ` <span class="note">(${MODES[x.mode].toLowerCase()})</span>` : ""}</li>`).join("")}</ul>` : ""}
        ${p.note ? `<p class="note">${esc(p.note)}</p>` : ""}
        ${fig(photosDe(v.id, p.id))}</div>`;
    }).join("")}`).join("")}
    ${v.repassage.on ? `<h2>Repassage</h2><p>${hm(c.rep)} par passage</p>` : ""}
  </div>`;
}
function renderFeuille(v) {
  const nb = photosDe(v.id).length;
  return `<div class="panel">
    <div class="row noprint">
      <button class="btn primary" data-action="imprimer">Imprimer ou PDF</button>
      <button class="btn" data-action="exporter">Enregistrer le fichier</button>
      <span class="note">${nb} photo${nb > 1 ? "s" : ""} jointe${nb > 1 ? "s" : ""}</span>
    </div>
    <div class="card">${feuilleHTML(v, urlDe)}</div>
  </div>`;
}
const enDataURL = blob => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); });
async function exporter(v, b) {
  const lbl = b.textContent; b.textContent = "Préparation…";
  try {
    const map = {}; for (const ph of photosDe(v.id)) map[ph.id] = await enDataURL(ph.blob);
    const css = document.querySelector("style").textContent;
    const html = `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feuille de route ${esc(v.client.nom)}</title><style>${css} body{padding:16px;max-width:900px;margin:0 auto}</style></head><body>${feuilleHTML(v, ph => map[ph.id])}</body></html>`;
    const nom = `Feuille de route ${(v.client.nom || "client").replace(/[^\p{L}\p{N} -]/gu, "").trim()} ${v.date}.html`;
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { try { await dl.save({ filename: nom, data: new Blob([html], { type: "text/html" }) }); } catch (e) {} }
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], { type: "text/html" })); a.download = nom; document.body.appendChild(a); a.click(); a.remove(); }
  } finally { b.textContent = lbl; }
}
render();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
