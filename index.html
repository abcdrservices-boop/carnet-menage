    const html = '<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feuille de route '.concat(esc(v.client.nom), "</title><style>").concat(css, " body{padding:16px;max-width:900px;margin:0 auto}</style></head><body>").concat(feuilleHTML(v, (ph) => map[ph.id]), "</body></html>");
    const nom = "Feuille de route ".concat((v.client.nom || "client").replace(new RegExp("[^\\p{L}\\p{N} -]", "gu"), "").trim(), " ").concat(v.date, ".html");
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) {
      try {
        await dl.save({ filename: nom, data: new Blob([html], { type: "text/html" }) });
      } catch (e) {
      }
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      a.download = nom;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  } finally {
    b.textContent = lbl;
  }
}
render();
</script>
